# Tests may unwrap, expect, panic and index: a failing assertion is the point of a test. The rest
# is the workspace lints in Cargo.toml, as in the Craft apps.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
# The Craft apps also forbid `egui::ComboBox` in favour of craft_ui's (egui#5225). CraftCloud doesn't
# depend on craft-ui yet; add that rule with the dependency.
cognitive-complexity-threshold = 30
