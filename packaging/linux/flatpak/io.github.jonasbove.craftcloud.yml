# Flatpak manifest for the single-file bundle attached to every GitHub release
# (craftcloud-<version>-linux-<arch>.flatpak). Build it with packaging/linux/flatpak-bundle.sh.
#
# It repackages the release's own Linux tarball (craftcloud-<version>-linux-<arch>.tar.gz, built by
# package.sh) instead of compiling Rust inside flatpak-builder: no network and no vendored crate
# sources during the build, and byte for byte the same binary as the AppImage, deb and rpm. The
# script unpacks the tarball into `stage/` next to a copy of this file. The binary needs the build
# host's glibc and loads X11, Wayland, xkbcommon and Vulkan/EGL at runtime; the freedesktop runtime
# has all of them, and the GPU driver comes from its org.freedesktop.Platform.GL extension.
#
# Structure adapted from craft-launcher's bundle manifest (MIT OR Apache-2.0; see NOTICE).
id: io.github.jonasbove.craftcloud
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: craftcloud
finish-args:
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for egui's wgpu renderer (Vulkan, or GL as a fallback).
  - --device=dri
  # The CraftCloud server, and the loopback control channel `craftcloud status|sync|…` talk to.
  - --share=network
  # The sync folder (~/CraftCloud by default, or any folder the person picks) lives in the home
  # folder, and the Craft apps on the host open and save the files in it.
  - --filesystem=home
  # Sign-in tokens go to the keychain (Secret Service: GNOME Keyring, KWallet, KeePassXC).
  - --talk-name=org.freedesktop.secrets
  # Tray icon (StatusNotifierItem) and desktop notifications, both over the session bus.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  # Not yet: Settings › Start at login (crates/native/src/login.rs) writes its autostart entry into
  # the sandbox's own config folder with the sandbox's path to the binary, which the host session
  # never runs. Doing it from a Flatpak needs the Background portal (or `flatpak run` in Exec and
  # --filesystem=xdg-config/autostart:create); until then, use the AppImage, deb or rpm for that.
modules:
  - name: craftcloud
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/craftcloud /app/bin/craftcloud
      - install -Dm644 share/applications/io.github.jonasbove.craftcloud.desktop /app/share/applications/io.github.jonasbove.craftcloud.desktop
      # Already has the release's version and date substituted by package.sh.
      - install -Dm644 share/metainfo/io.github.jonasbove.craftcloud.metainfo.xml /app/share/metainfo/io.github.jonasbove.craftcloud.metainfo.xml
      - mkdir -p /app/share/icons /app/share/doc && cp -R share/icons/hicolor /app/share/icons/ && cp -R share/doc/craftcloud /app/share/doc/
    sources:
      - type: dir
        path: stage
