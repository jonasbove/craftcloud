[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/jonasbove/craftcloud"

# Same house rules as the Craft apps (craft-launcher's workspace).
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
craftcloud-core = { path = "crates/core" }
craftcloud-native = { path = "crates/native" }
craftcloud-ui-egui = { path = "crates/ui-egui" }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
eframe = { version = "0.37", default-features = false }
egui_kittest = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
url = "2"
percent-encoding = "2"
# craft-libs, pinned by git rev like craft-launcher's (bump deliberately).
craft-dav = { version = "=0.1.0", git = "https://github.com/storytold/craft-libs", rev = "8ebdc499a5e8f13f249178072e56ccd7b45bc5b5" }
craft-xml = { version = "=0.1.0", git = "https://github.com/storytold/craft-libs", rev = "8ebdc499a5e8f13f249178072e56ccd7b45bc5b5" }
craft-settings = { version = "=0.1.0", git = "https://github.com/storytold/craft-libs", rev = "8ebdc499a5e8f13f249178072e56ccd7b45bc5b5" }

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
strip = "debuginfo"

# The egui family and winit on the same reviewed storytold fork commits as the Craft apps
# (craft-launcher's Cargo.toml), so craft-libs crates link against the same egui.
[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
