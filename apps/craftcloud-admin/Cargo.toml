[package]
name = "craftcloud-admin"
description = "CraftCloud's small server-side service: live config.json, the admin settings API, and the gate that serves only enabled Craft web apps"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "craftcloud-admin"
path = "src/main.rs"

[dependencies]
craftcloud-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# Pure Rust, no TLS: listens on 127.0.0.1 behind Caddy and talks to OxiCloud on 127.0.0.1, so it
# cross-compiles to static musl binaries for every platform (Dockerfile `admin` stage).
tiny_http = "0.12"
ureq = { version = "3.5", default-features = false }
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }

[dev-dependencies]
tempfile = "3"
