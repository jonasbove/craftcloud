[package]
name = "craftcloud-core"
description = "CraftCloud's model and logic without UI: server addresses, the server's runtime config, and (next) the API client and sync engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
percent-encoding = { workspace = true }
craft-dav = { workspace = true }
craft-xml = { workspace = true }
# `logging::WireCapped`, the filter the desktop client and craftcloud-admin log through.
log = { workspace = true }
# Share-link expiry (presets, dates, times). No time zone database: the web passes the browser's
# offset, and nothing here reads the system clock (that would panic on wasm32).
jiff = { version = "0.2", default-features = false, features = ["std"] }

[features]
# `storage::probe::fake`, the scripted WebDAV server the probe tests drive; `crates/native`'s tests
# put it behind a loopback HTTP server. Never on by default, never in a build a person runs.
test-support = []

[dev-dependencies]
# Property tests of the sync decisions (src/reconcile/properties.rs). Without the default `fork`
# and `timeout` features: no subprocesses, fewer crates.
proptest = { version = "1.12", default-features = false, features = ["std"] }
