# cargo-deny config, as in the Craft apps (craft-anything's deny.toml). Run `cargo deny check`; CI
# runs it as its own job (.github/workflows/ci.yml). We never link or bundle copyleft code.
#
# Only the Rust programs in this workspace are checked here. The OxiCloud server is not a Cargo
# dependency: the image runs the upstream OxiCloud image unmodified (Dockerfile, NOTICE).

[graph]
all-features = true

[advisories]
# RustSec advisories: vulnerable, unmaintained or yanked crates are reported.
yanked = "deny"
# "Unmaintained" notices with no fixed version to move to. Each says why it is safe to carry and
# when it goes; docs/ROADMAP.md tracks dropping them.
ignore = [
    # zvariant, zvariant_derive and zbus_names were folded into zbus 6 (2026-10). They come in through
    # zbus 4 and 5: egui's accessibility (accesskit_unix, shared with the Craft apps) and keyring 3's
    # Secret Service backend. Not vulnerabilities; they go when those move to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant: merged into zbus 6; via accesskit (egui) and keyring 3" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: merged into zbus 6; via accesskit (egui) and keyring 3" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: merged into zbus 6; via accesskit (egui) and keyring 3" },
    # Only on tray-icon's GTK path (libappindicator), which no CraftCloud build uses: Linux and the
    # BSDs take its ksni backend (apps/craftcloud/Cargo.toml). cargo-deny sees it through all-features.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: only on tray-icon's GTK path, which no build uses" },
]

[licenses]
# Permissive licences only. Dual-licensed crates (e.g. self_cell, r-efi) pass through their
# permissive option, so they need no exception.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "OFL-1.1",         # egui's embedded default fonts (epaint_default_fonts)
    "Ubuntu-font-1.0", # same crate
]
confidence-threshold = 0.9
exceptions = [
    # MPL-2.0 is file-level copyleft: allowed only for named crates, used unmodified.
    { allow = ["MPL-2.0"], crate = "option-ext" }, # via dirs (craft-settings)
    # Public-domain dedications, no conditions at all. Only for the crates that offer nothing else.
    { allow = ["Unlicense"], crate = "ksni" }, # the Linux tray (StatusNotifierItem over D-Bus)
    { allow = ["CC0-1.0"], crate = "notify" }, # file-system events for the sync folder
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Path dependencies between workspace crates are exempt: every crate here is `publish = false`.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# craft-libs pinned by rev (Cargo.toml), and the egui and winit forks the Craft apps share
# ([patch.crates-io]).
allow-git = [
    "https://github.com/storytold/craft-libs",
    "https://github.com/storytold/egui.git",
    "https://github.com/storytold/winit.git",
]
