# Apache httpd as a plain WebDAV server for CraftCloud's live tests (compose.yaml, service
# `apache`): one DAV folder at /dav/ with basic auth for the user in dav.htpasswd. Loopback only,
# never for real data.
ServerRoot "/usr/local/apache2"
Listen 80
ServerName localhost

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule auth_basic_module modules/mod_auth_basic.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule dir_module modules/mod_dir.so
LoadModule alias_module modules/mod_alias.so
LoadModule dav_module modules/mod_dav.so
LoadModule dav_fs_module modules/mod_dav_fs.so
LoadModule dav_lock_module modules/mod_dav_lock.so

User daemon
Group daemon

ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog /proc/self/fd/1 common

TypesConfig conf/mime.types

DavLockDB /var/dav/lock/DavLock
# The ETag from the file's content, not its time: with MTime in it Apache marks a tag weak
# (`W/"…"`) for a second after a write, and a weak tag never matches `If-Match`, so the check on
# connect refused the overwrite of a file just written (step 6).
FileETag Digest

<Directory />
    AllowOverride none
    Require all denied
</Directory>

Alias /dav /var/dav/data
<Directory /var/dav/data>
    Dav On
    Options None
    AllowOverride None
    AuthType Basic
    AuthName "WebDAV"
    AuthUserFile /usr/local/apache2/conf/dav.htpasswd
    Require valid-user
</Directory>
