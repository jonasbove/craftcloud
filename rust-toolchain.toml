# The Rust every build uses: local, CI, the release workflow and the Docker image (Dockerfile RUST_IMAGE).
# Move it in its own pull request, together with the workflows' `toolchain:` and the Dockerfile's images.
# `rust-version` in Cargo.toml stays the oldest Rust that builds CraftCloud (FreeBSD's own package, distros).
[toolchain]
channel = "1.100.0"
components = ["clippy", "rustfmt"]
targets = ["wasm32-unknown-unknown"]
profile = "minimal"
