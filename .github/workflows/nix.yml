# Evaluates the Nix flake (no build, a minute or two): the packages, the dev shell and the NixOS
# server module (checks.module). `nix build` / `nix develop` stop at evaluation when Cargo.lock or
# nix/module.nix gains something the flake can't handle, and nothing else would notice. The Craft
# apps' check (craft-common-actions nix.yml), written out here for the same reason as the gate in
# ci.yml.
name: Nix

on:
  push:
    branches: [main]
    paths: ["flake.nix", "flake.lock", "nix/**", "Cargo.lock", ".github/workflows/nix.yml"]
  pull_request:
    paths: ["flake.nix", "flake.lock", "nix/**", "Cargo.lock", ".github/workflows/nix.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    name: eval
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Check flake evaluation
        run: nix flake check --no-build --all-systems
