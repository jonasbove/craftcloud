# Quick static checks for the release pipeline (seconds, no Rust build), through the Craft apps' shared lint
# (craft-common-actions' packaging-lint.yml): actionlint, shellcheck on packaging/ (with .shellcheckrc), the
# PowerShell scripts' syntax, the Linux desktop entry and AppStream file, the macOS plists and the MSI sources.
# CraftCloud's own checks run after it (.github/scripts/packaging-lint-extra.sh): shellcheck on .github/scripts,
# the label and gitmoji lists and the Claude workflows' checks (.github/scripts/claude-bot-test.sh).
#
# Pinned to a craft-common-actions commit (main on 2026-11-26), not @main as the Craft apps call it:
# CraftCloud is not a storytold repository, so a breaking change there would not come with a pull request
# here. Move the pin in a CI pull request of its own, after reading the change. The pin covers the workflow
# only: it runs its lint action from craft-common-actions' main (`actions/packaging-lint@main`).
name: Packaging lint

on:
  push:
    branches: [main]
    paths: [".github/workflows/**", ".github/actionlint.yaml", ".github/scripts/**", ".github/*.json", "packaging/**", ".shellcheckrc"]
  pull_request:
    paths: [".github/workflows/**", ".github/actionlint.yaml", ".github/scripts/**", ".github/*.json", "packaging/**", ".shellcheckrc"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: storytold/craft-common-actions/.github/workflows/packaging-lint.yml@4ec2a14646b538253fd5ebe109bf463a3d31b061
    with:
      extra-checks-script: .github/scripts/packaging-lint-extra.sh
