# CraftCloud app manifest: which Craft web builds go into the image, and which files they open.
#
# Pins (version, asset, sha256) are written by `cargo xtask bump-apps`; everything else is edited by hand.
# The Dockerfile (`cargo xtask fetch-apps`) downloads https://github.com/<repo>/releases/download/v<version>/<asset>, checks sha256,
# and unpacks it to /srv/craftcloud/apps/<id>/.
#
# web       false for a desktop app with no web build yet: it is listed by `craftcloud apps` and taken by
#           `--app`, and has no version, asset, sha256 or bridge (nothing is fetched for it)
# bridge    how CraftCloud gets files in and out (docs/ARCHITECTURE.md, "Apps in the browser"):
#             native      craft-web-host (?host=parent, <app>:open / <app>:save)
#             lightcraft  LightCraft's own bridge (import and export only)
#             shim        craftcloud-shim.js injected into index.html (experimental)
# query     extra URL query for the app page (besides host=parent)
# opens     extensions the app can open from the cloud
# default   extensions this app claims when a file is opened (each extension has exactly one default)
# fixups    repairs for packaging bugs in the pinned release, applied by `cargo xtask fetch-apps`
# tagline, color, ink
#           display data for the app lists, from craft-launcher's crates/core/catalog.toml
#           (MIT OR Apache-2.0, Copyright (c) 2026 ArtCraft Team)

[apps.wordcraft]
name    = "WordCraft"
tagline = "Writing and document design"
color   = "#3f5fe0"
ink     = ["#8ea2ff", "#2a44b8"]   # text colour on dark / light
repo    = "storytold/wordcraft"
version = "0.18.1"
asset   = "wordcraft-web-0.18.1.zip"
sha256  = "3daa7c2d1f209a7eeb2527fcefa3fe31e875848fb1970d68f54edae55fe0bc9f"
bridge  = "native"
opens   = ["docx", "docm", "dotx", "dotm", "doc", "dot", "odt", "ott", "fodt", "rtf", "txt", "md", "html", "htm", "tex"]
default = ["docx", "docm", "dotx", "dotm", "doc", "dot", "odt", "ott", "fodt", "rtf", "txt", "md"]

